services:
  db:
    image: postgres:16-alpine
    container_name: eduspark-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduspark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-eduspark}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Optional: expose only if you want to connect from the host
    # ports:
    #   - "${POSTGRES_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduspark}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduspark-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduspark}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-eduspark}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NODE_ENV: production
      PORT: 8000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    # Backend stays inside the compose network — frontend's nginx proxies /api
    expose:
      - "8000"
    volumes:
      # Persist PDF uploads across container restarts/rebuilds
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduspark-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # 3007 chosen to avoid clashes with other VPS apps on 3000/3001/3004
    # Override via APP_PORT in .env
    ports:
      - "${APP_PORT:-3007}:80"

volumes:
  pgdata:
  uploads:
